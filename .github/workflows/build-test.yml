name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify sound inventory and website catalog
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/generate_sound_catalog.py --check

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][^(]*' | head -1 | xargs)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator available" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild -project ThaiSheet.xcodeproj -scheme ThaiSheet \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}" \
            -resultBundlePath "$RUNNER_TEMP/ThaiSheet.xcresult" \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -100

      - name: Show test failure details
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/xcodebuild.log" ]; then
            grep -n -C 3 -E 'error:|Test Case .*failed|Test crashed|Asynchronous wait failed|XCTAssert|XCTUnwrap' \
              "$RUNNER_TEMP/xcodebuild.log" || true
          fi

      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/ThaiSheet.xcresult
          retention-days: 7
